name: Patch and verify full Cesium globe

on:
  push:
    branches:
      - fix/cesium-full-globe

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[full-globe]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cesium-full-globe
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python tools/use_full_globe.py
      - run: npm ci
      - run: npx eslint src/app/ScenarioGlobe.tsx --ext ts,tsx --report-unused-disable-directives --max-warnings 0
      - run: npm test -- --run
      - run: npm run build
      - name: Commit full-globe fix
        run: |
          git config user.name "jtflack-grc"
          git config user.email "202126308+jtflack-grc@users.noreply.github.com"
          git add src/app/ScenarioGlobe.tsx
          git commit -m "Use full-globe Cesium geometry and imagery fallback [full-globe]"
          git push origin fix/cesium-full-globe
