name: Patch tail interrogation

on:
  push:
    branches:
      - feat/tail-interrogation

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[tail-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tail-interrogation
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Link the tail explorer across all three rails
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          dashboard = Path('src/app/MetricsDashboard.tsx')
          text = dashboard.read_text()
          import_anchor = 'import { EduTooltip } from "./EduTooltip";\n'
          tail_import = 'import { LossTailExplorer } from "./LossTailExplorer";\n'
          if tail_import not in text:
              if import_anchor not in text:
                  raise SystemExit('dashboard import anchor not found')
              text = text.replace(import_anchor, import_anchor + tail_import, 1)

          text, removed = re.subn(
              r'\n  const lossDistributionData = useMemo\(\(\) => \{.*?\n  \}, \[dynamicLossProfile\]\);\n',
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          if removed != 1 and 'const lossDistributionData' in text:
              raise SystemExit('lossDistributionData block not removed')

          start_marker = '''          <div className="mt-4 rounded-xl border border-war-border/80 bg-black/60 p-4">\n            <h3 className="flex items-center gap-1.5 text-xs font-semibold text-war-white/90 mb-3">\n              Loss distribution (key FAIR percentiles)'''
          next_marker = '''          <div className="mt-4 rounded-xl border border-war-border/80 bg-black/60 p-4">\n            <h3 className="flex items-center gap-1.5 text-xs font-semibold text-war-white/90 mb-3">\n              Revenue at risk (FMVA view)'''
          start = text.find(start_marker)
          end = text.find(next_marker, start + 1 if start >= 0 else 0)
          if start < 0 or end < 0:
              raise SystemExit('loss distribution chart anchors not found')
          explorer = '''          <LossTailExplorer\n            scenarioId={scenario.id}\n            meanLossMillions={dynamicLossProfile.meanLoss}\n            grossP90Millions={dynamicLossProfile.grossP90}\n            netP90Millions={dynamicLossProfile.netP90}\n            frequencyPerYear={dynamicLossProfile.frequency}\n            annualRevenueMillions={scenario.company.annualRevenueMillions}\n            ebitdaMarginPercent={scenario.company.ebitdaMarginPercent}\n            topDriver={scenario.lossProfile.topDriver}\n          />\n'''
          text = text[:start] + explorer + text[end:]
          dashboard.write_text(text)

          chat = Path('src/app/ChatPanel.tsx')
          text = chat.read_text()
          selector_anchor = '  const linkedFocus = useImpactInteractionStore((s) => s.linkedFocus);\n'
          selector = '  const tailSelection = useImpactInteractionStore((s) => s.tailSelection);\n'
          if selector not in text:
              if selector_anchor not in text:
                  raise SystemExit('chat selector anchor not found')
              text = text.replace(selector_anchor, selector_anchor + selector, 1)

          focus_block = '''        {linkedFocus && (\n          <div className="rounded-lg border border-red-400/40 bg-red-950/15 px-4 py-3">\n            <div className="text-[9px] uppercase tracking-[0.2em] text-red-300/80">Linked model focus</div>\n            <div className="mt-1 text-xs font-semibold text-war-white">{LINKED_FOCUS_COPY[linkedFocus].label}</div>\n            <p className="mt-1 text-[11px] leading-relaxed text-war-muted">{LINKED_FOCUS_COPY[linkedFocus].body}</p>\n          </div>\n        )}\n'''
          tail_block = '''\n        {tailSelection?.scenarioId === scenario.id && (\n          <div className="border border-red-400/35 bg-red-950/10 px-4 py-3">\n            <div className="text-[9px] uppercase tracking-[0.2em] text-red-300/80">Tail lens</div>\n            <div className="mt-1 flex items-baseline justify-between gap-3">\n              <div className="text-xs font-semibold text-war-white">{tailSelection.label}</div>\n              <div className="font-mono text-[10px] text-red-200">\n                {(tailSelection.probabilityMass * 100).toFixed(1)}% mass\n              </div>\n            </div>\n            <p className="mt-1 text-[11px] leading-relaxed text-war-muted">\n              Selected losses span ${tailSelection.lowMillions.toFixed(0)}M–${tailSelection.highMillions.toFixed(0)}M with a conditional mean of ${tailSelection.conditionalMeanMillions.toFixed(1)}M. That conditional mean is about {tailSelection.ebitdaSharePercent.toFixed(0)}% of annual EBITDA.\n            </p>\n          </div>\n        )}\n'''
          if 'Tail lens</div>' not in text:
              if focus_block not in text:
                  raise SystemExit('chat linked focus block not found')
              text = text.replace(focus_block, focus_block + tail_block, 1)
          chat.write_text(text)

          globe = Path('src/app/ScenarioGlobe.tsx')
          text = globe.read_text()
          globe_selector_anchor = '  const linkedFocus = useImpactInteractionStore((s) => s.linkedFocus);\n'
          globe_selector = '  const tailSelection = useImpactInteractionStore((s) => s.tailSelection);\n'
          if globe_selector not in text:
              if globe_selector_anchor not in text:
                  raise SystemExit('globe selector anchor not found')
              text = text.replace(globe_selector_anchor, globe_selector_anchor + globe_selector, 1)

          state_anchor = '''  const [terrainState, setTerrainState] = useState<\n    "loading" | "streaming" | "fallback" | "error"\n  >("loading");\n'''
          state_replacement = state_anchor + '''\n  const activeTailSelection =\n    tailSelection?.scenarioId === scenario.id ? tailSelection : null;\n'''
          if 'const activeTailSelection' not in text:
              if state_anchor not in text:
                  raise SystemExit('globe state anchor not found')
              text = text.replace(state_anchor, state_replacement, 1)

          scale_anchor = '''    const focusScale = linkedFocus === "grossP90" ? 1.45 : linkedFocus === "netP90" ? 1.28 : linkedFocus === "frequency" ? 1.18 : 1;\n    const choiceMagnitude = lastChoiceImpact'''
          scale_replacement = '''    const focusScale = linkedFocus === "grossP90" ? 1.45 : linkedFocus === "netP90" ? 1.28 : linkedFocus === "frequency" ? 1.18 : 1;\n    const tailScale = activeTailSelection\n      ? 1 +\n        Math.min(\n          0.75,\n          activeTailSelection.percentileLow * 0.45 +\n            Math.min(0.3, activeTailSelection.ebitdaSharePercent / 100)\n        )\n      : 1;\n    const choiceMagnitude = lastChoiceImpact'''
          if 'const tailScale = activeTailSelection' not in text:
              if scale_anchor not in text:
                  raise SystemExit('globe scale anchor not found')
              text = text.replace(scale_anchor, scale_replacement, 1)

          beacon_anchor = '    const beaconScale = magnitudeScale * focusScale * choiceScale;\n'
          beacon_replacement = '    const beaconScale = magnitudeScale * focusScale * choiceScale * tailScale;\n'
          if beacon_anchor in text:
              text = text.replace(beacon_anchor, beacon_replacement, 1)

          dependency_anchor = '''    ready,\n    linkedFocus,\n    lastChoiceImpact,'''
          dependency_replacement = '''    ready,\n    activeTailSelection,\n    linkedFocus,\n    lastChoiceImpact,'''
          if dependency_anchor in text:
              text = text.replace(dependency_anchor, dependency_replacement, 1)

          badge_anchor = '''      <div className="absolute right-3 top-3 z-10 rounded border border-white/15 bg-black/65 px-2 py-1 text-[9px] uppercase tracking-[0.16em] text-slate-300 backdrop-blur">\n        {terrainState === "streaming" && "Cesium terrain · streamed"}\n        {terrainState === "loading" && "Cesium terrain · loading"}\n        {terrainState === "fallback" && "Cesium terrain · fallback"}\n        {terrainState === "error" && "Cesium · unavailable"}\n      </div>\n'''
          tail_badge = '''\n      {activeTailSelection && (\n        <div className="absolute right-3 top-10 z-10 border border-red-400/35 bg-black/75 px-2 py-1.5 font-mono text-[9px] text-red-200">\n          <div className="uppercase tracking-[0.14em]">{activeTailSelection.label}</div>\n          <div className="mt-0.5 text-slate-300">\n            Conditional mean ${activeTailSelection.conditionalMeanMillions.toFixed(1)}M\n          </div>\n        </div>\n      )}\n'''
          if 'Conditional mean ${activeTailSelection.conditionalMeanMillions' not in text:
              if badge_anchor not in text:
                  raise SystemExit('globe badge anchor not found')
              text = text.replace(badge_anchor, badge_anchor + tail_badge, 1)
          globe.write_text(text)
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - name: Commit linked tail interrogation
        run: |
          git config user.name "jtflack-grc"
          git config user.email "202126308+jtflack-grc@users.noreply.github.com"
          git add src/app/MetricsDashboard.tsx src/app/ChatPanel.tsx src/app/ScenarioGlobe.tsx
          git commit -m "Link Monte Carlo tail interrogation across rails [tail-patched]"
          git push origin feat/tail-interrogation
