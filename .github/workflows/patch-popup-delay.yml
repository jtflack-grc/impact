name: Patch popup delay

on:
  push:
    branches:
      - fix/delay-scenario-popup

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/delay-scenario-popup
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Delay scenario popup until camera choreography finishes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/ScenarioGlobe.tsx")
          text = path.read_text()

          text = text.replace(
              '  const lastCameraScenarioRef = useRef<string | null>(null);\n  const [showPopup, setShowPopup] = useState(true);\n',
              '  const lastCameraScenarioRef = useRef<string | null>(null);\n  const popupTimerRef = useRef<number | null>(null);\n  const [showPopup, setShowPopup] = useState(false);\n',
              1,
          )

          text = text.replace(
              '      countrySourceRef.current = null;\n      viewerRef.current = null;\n      if (viewer && !viewer.isDestroyed()) viewer.destroy();\n',
              '      countrySourceRef.current = null;\n      viewerRef.current = null;\n      if (popupTimerRef.current !== null) {\n        window.clearTimeout(popupTimerRef.current);\n        popupTimerRef.current = null;\n      }\n      if (viewer && !viewer.isDestroyed()) viewer.destroy();\n',
              1,
          )

          text = text.replace(
              '    const scenarioChanged = lastCameraScenarioRef.current !== scenario.id;\n    if (scenarioChanged) setShowPopup(true);\n    viewer.entities.removeAll();\n',
              '    const scenarioChanged = lastCameraScenarioRef.current !== scenario.id;\n    if (scenarioChanged) {\n      if (popupTimerRef.current !== null) {\n        window.clearTimeout(popupTimerRef.current);\n        popupTimerRef.current = null;\n      }\n      setShowPopup(false);\n    }\n    viewer.entities.removeAll();\n',
              1,
          )

          old = '''          viewer.camera.flyTo({\n            destination: Cesium.Cartesian3.fromDegrees(scenario.longitude, scenario.latitude, 10_500_000),\n            orientation: {\n              heading: Cesium.Math.toRadians(0),\n              pitch: Cesium.Math.toRadians(-90),\n              roll: 0,\n            },\n            duration: 0.75,\n          });'''
          new = '''          viewer.camera.flyTo({\n            destination: Cesium.Cartesian3.fromDegrees(scenario.longitude, scenario.latitude, 10_500_000),\n            orientation: {\n              heading: Cesium.Math.toRadians(0),\n              pitch: Cesium.Math.toRadians(-90),\n              roll: 0,\n            },\n            duration: 0.75,\n            complete: () => {\n              if (viewer.isDestroyed() || lastCameraScenarioRef.current !== scenario.id) return;\n              popupTimerRef.current = window.setTimeout(() => {\n                if (!viewer.isDestroyed() && lastCameraScenarioRef.current === scenario.id) {\n                  setShowPopup(true);\n                }\n                popupTimerRef.current = null;\n              }, 300);\n            },\n          });'''
          if old not in text:
              raise SystemExit('camera settle block not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - name: Commit popup delay
        run: |
          git config user.name "jtflack-grc"
          git config user.email "202126308+jtflack-grc@users.noreply.github.com"
          git add src/app/ScenarioGlobe.tsx
          git commit -m "Delay scenario card until camera settles"
          git push origin HEAD:fix/delay-scenario-popup
