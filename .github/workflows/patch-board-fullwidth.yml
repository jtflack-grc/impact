name: Verify full-width board view

on:
  push:
    branches:
      - feat/board-fullwidth

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[board-fullwidth-formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/board-fullwidth
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/BoardMode.tsx
      - run: npx eslint src/app/BoardMode.tsx --ext ts,tsx --report-unused-disable-directives --max-warnings 0
      - run: npm test -- --run
      - run: npm run build
      - name: Commit formatting
        run: |
          git config user.name "jtflack-grc"
          git config user.email "202126308+jtflack-grc@users.noreply.github.com"
          git add src/app/BoardMode.tsx
          git diff --cached --quiet || git commit -m "Format full-width board view [board-fullwidth-formatted]"
          git push origin feat/board-fullwidth
