name: Patch guided voice timing

on:
  push:
    branches:
      - fix/guided-voice-timing

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[voice-timing-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guided-voice-timing
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Tie guided advancement to narration completion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/GuidedScenarioMode.tsx')
          text = p.read_text()

          text = text.replace(
              'import { useEffect, useMemo, useState } from "react";',
              'import { useEffect, useMemo, useRef, useState } from "react";',
              1,
          )

          state_anchor = '''  const [playing, setPlaying] = useState(true);\n  const [voices, setVoices] = useState<SpeechSynthesisVoice[]>([]);\n'''
          state_new = '''  const [playing, setPlaying] = useState(true);\n  const playingRef = useRef(true);\n  const [voices, setVoices] = useState<SpeechSynthesisVoice[]>([]);\n'''
          if state_anchor not in text:
              raise SystemExit('playing state anchor not found')
          text = text.replace(state_anchor, state_new, 1)

          init_anchor = '''  useEffect(() => {\n    if (!guidedActive) return;\n    setPlaying(true);\n    setGuidedStep(0);\n  }, [guidedActive, scenario.id, setGuidedStep]);\n'''
          init_new = '''  useEffect(() => {\n    if (!guidedActive) return;\n    playingRef.current = true;\n    setPlaying(true);\n    setGuidedStep(0);\n  }, [guidedActive, scenario.id, setGuidedStep]);\n\n  useEffect(() => {\n    playingRef.current = playing;\n  }, [playing]);\n'''
          if init_anchor not in text:
              raise SystemExit('guided init anchor not found')
          text = text.replace(init_anchor, init_new, 1)

          speech_old = '''  useEffect(() => {\n    if (!guidedActive || !guidedVoice || !("speechSynthesis" in window)) return;\n    const synth = window.speechSynthesis;\n    synth.cancel();\n    const utterance = new SpeechSynthesisUtterance(\n      `${current.title}. ${current.text}`\n    );\n    configureUtterance(utterance, selectedVoice);\n    synth.speak(utterance);\n    return () => synth.cancel();\n  }, [current, guidedActive, guidedVoice, selectedVoice]);\n\n  useEffect(() => {\n    if (!guidedActive || !playing || safeStep >= steps.length - 1) return;\n    const duration = Math.max(4800, Math.min(9000, current.text.length * 36));\n    const timer = window.setTimeout(\n      () => setGuidedStep(safeStep + 1),\n      duration\n    );\n    return () => window.clearTimeout(timer);\n  }, [\n    current.text.length,\n    guidedActive,\n    playing,\n    safeStep,\n    setGuidedStep,\n    steps.length,\n  ]);\n'''
          speech_new = '''  useEffect(() => {\n    if (!guidedActive || !guidedVoice || !("speechSynthesis" in window)) return;\n    const synth = window.speechSynthesis;\n    let disposed = false;\n    let advanceTimer: number | null = null;\n\n    synth.cancel();\n    synth.resume();\n    const utterance = new SpeechSynthesisUtterance(\n      `${current.title}. ${current.text}`\n    );\n    configureUtterance(utterance, selectedVoice);\n    utterance.onend = () => {\n      if (disposed || !playingRef.current || safeStep >= steps.length - 1) return;\n      advanceTimer = window.setTimeout(() => {\n        if (!disposed && playingRef.current) setGuidedStep(safeStep + 1);\n      }, 650);\n    };\n    synth.speak(utterance);\n\n    return () => {\n      disposed = true;\n      if (advanceTimer !== null) window.clearTimeout(advanceTimer);\n      synth.cancel();\n      synth.resume();\n    };\n  }, [\n    current,\n    guidedActive,\n    guidedVoice,\n    safeStep,\n    selectedVoice,\n    setGuidedStep,\n    steps.length,\n  ]);\n\n  useEffect(() => {\n    if (\n      !guidedActive ||\n      guidedVoice ||\n      !playing ||\n      safeStep >= steps.length - 1\n    )\n      return;\n    const duration = Math.max(4800, Math.min(9000, current.text.length * 36));\n    const timer = window.setTimeout(\n      () => setGuidedStep(safeStep + 1),\n      duration\n    );\n    return () => window.clearTimeout(timer);\n  }, [\n    current.text.length,\n    guidedActive,\n    guidedVoice,\n    playing,\n    safeStep,\n    setGuidedStep,\n    steps.length,\n  ]);\n'''
          if speech_old not in text:
              raise SystemExit('speech/timer block anchor not found')
          text = text.replace(speech_old, speech_new, 1)

          preview_anchor = '''  const previewVoice = () => {\n    if (!("speechSynthesis" in window)) return;\n    const synth = window.speechSynthesis;\n    synth.cancel();\n    const utterance = new SpeechSynthesisUtterance(\n      "Impact guided briefing. Quantified cyber risk, translated into business consequence."\n    );\n    configureUtterance(utterance, selectedVoice);\n    synth.speak(utterance);\n  };\n\n  const exit = () => {\n'''
          preview_new = '''  const previewVoice = () => {\n    if (!("speechSynthesis" in window)) return;\n    const synth = window.speechSynthesis;\n    synth.cancel();\n    synth.resume();\n    const utterance = new SpeechSynthesisUtterance(\n      "Impact guided briefing. Quantified cyber risk, translated into business consequence."\n    );\n    configureUtterance(utterance, selectedVoice);\n    synth.speak(utterance);\n  };\n\n  const togglePlayback = () => {\n    const nextPlaying = !playing;\n    playingRef.current = nextPlaying;\n    setPlaying(nextPlaying);\n    if (guidedVoice && "speechSynthesis" in window) {\n      if (nextPlaying) window.speechSynthesis.resume();\n      else window.speechSynthesis.pause();\n    }\n  };\n\n  const exit = () => {\n'''
          if preview_anchor not in text:
              raise SystemExit('preview anchor not found')
          text = text.replace(preview_anchor, preview_new, 1)

          button_old = '''          onClick={() => setPlaying(!playing)}\n'''
          button_new = '''          onClick={togglePlayback}\n'''
          if button_old not in text:
              raise SystemExit('pause button anchor not found')
          text = text.replace(button_old, button_new, 1)

          p.write_text(text)
          PY
      - run: npm ci
      - run: npx prettier --write src/app/GuidedScenarioMode.tsx
      - run: npx eslint src/app/GuidedScenarioMode.tsx --ext ts,tsx --report-unused-disable-directives --max-warnings 0
      - run: npm test -- --run
      - run: npm run build
      - name: Commit timing fix
        run: |
          git config user.name "jtflack-grc"
          git config user.email "202126308+jtflack-grc@users.noreply.github.com"
          git add src/app/GuidedScenarioMode.tsx
          git commit -m "Sync guided cards to narration completion [voice-timing-patched]"
          git push origin fix/guided-voice-timing
