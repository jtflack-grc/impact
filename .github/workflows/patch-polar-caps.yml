name: Patch and verify Cesium polar caps

on:
  push:
    branches:
      - fix/close-cesium-poles

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[polar-caps]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/close-cesium-poles
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python tools/add_polar_caps.py
      - run: npm ci
      - run: npx eslint src/app/ScenarioGlobe.tsx --ext ts,tsx --report-unused-disable-directives --max-warnings 0
      - run: npm test -- --run
      - run: npm run build
      - name: Commit polar cap fix
        run: |
          git config user.name "jtflack-grc"
          git config user.email "202126308+jtflack-grc@users.noreply.github.com"
          git add src/app/ScenarioGlobe.tsx
          git commit -m "Close Cesium polar imagery gaps [polar-caps]"
          git push origin fix/close-cesium-poles
