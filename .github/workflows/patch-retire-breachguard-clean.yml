name: Patch and verify Decision Desk framing

on:
  push:
    branches:
      - refactor/retire-breachguard-clean

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[decision-desk-clean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/retire-breachguard-clean
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python tools/retire_breachguard_patch.py
      - run: npm ci
      - run: npx eslint src/app/ChatPanel.tsx src/content/securityScenarios.ts src/content/schema.ts --ext ts,tsx --report-unused-disable-directives --max-warnings 0
      - run: npm test -- --run
      - run: npm run build
      - name: Confirm legacy framing is gone
        run: |
          if grep -RniE 'BreachGuard|IT Security Assistant|Assistant header|LLM Message' src README.md DESIGN.md index.html; then
            echo 'Legacy BreachGuard framing remains' >&2
            exit 1
          fi
      - name: Commit Decision Desk framing
        run: |
          git config user.name "jtflack-grc"
          git config user.email "202126308+jtflack-grc@users.noreply.github.com"
          git add src/app/ChatPanel.tsx src/content/securityScenarios.ts src/content/schema.ts
          git commit -m "Retire BreachGuard for Decision Desk [decision-desk-clean]"
          git push origin refactor/retire-breachguard-clean
