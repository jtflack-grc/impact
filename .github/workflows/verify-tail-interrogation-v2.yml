name: Verify tail interrogation v2

on:
  push:
    branches:
      - feat/tail-interrogation

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[tail-linked]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tail-interrogation
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch linked tail lens
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          dashboard = Path('src/app/MetricsDashboard.tsx')
          text = dashboard.read_text()
          if 'import { LossTailExplorer } from "./LossTailExplorer";' not in text:
              text = text.replace(
                  'import { EduTooltip } from "./EduTooltip";\n',
                  'import { EduTooltip } from "./EduTooltip";\nimport { LossTailExplorer } from "./LossTailExplorer";\n',
                  1,
              )
          text = re.sub(
              r'\n  const lossDistributionData = useMemo\(\(\) => \{.*?\n  \}, \[dynamicLossProfile\]\);\n',
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          start = text.find('          <div className="mt-4 rounded-xl border border-war-border/80 bg-black/60 p-4">\n            <h3 className="flex items-center gap-1.5 text-xs font-semibold text-war-white/90 mb-3">\n              Loss distribution (key FAIR percentiles)')
          end = text.find('          <div className="mt-4 rounded-xl border border-war-border/80 bg-black/60 p-4">\n            <h3 className="flex items-center gap-1.5 text-xs font-semibold text-war-white/90 mb-3">\n              Revenue at risk (FMVA view)', start + 1)
          if start < 0 or end < 0:
              raise SystemExit('dashboard chart anchors not found')
          replacement = '''          <LossTailExplorer\n            scenarioId={scenario.id}\n            meanLossMillions={dynamicLossProfile.meanLoss}\n            grossP90Millions={dynamicLossProfile.grossP90}\n            netP90Millions={dynamicLossProfile.netP90}\n            frequencyPerYear={dynamicLossProfile.frequency}\n            annualRevenueMillions={scenario.company.annualRevenueMillions}\n            ebitdaMarginPercent={scenario.company.ebitdaMarginPercent}\n            topDriver={scenario.lossProfile.topDriver}\n          />\n'''
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              '              <div className="text-[10px] text-war-muted mb-2">Monte Carlo simulation results (10,000 iterations)</div>',
              '              <div className="text-[10px] text-war-muted mb-2">Scenario loss anchors (published case inputs)</div>',
              1,
          )
          text = text.replace(
              '<BarChart data={lossDistributionData}>',
              '''<BarChart\n                  data={[\n                    { label: "Mean loss", value: dynamicLossProfile.meanLoss },\n                    { label: "Gross P90", value: dynamicLossProfile.grossP90 },\n                    { label: "Net P90", value: dynamicLossProfile.netP90 },\n                  ]}\n                >''',
              1,
          )
          dashboard.write_text(text)

          chat = Path('src/app/ChatPanel.tsx')
          text = chat.read_text()
          if 'const tailSelection = useImpactInteractionStore' not in text:
              text = text.replace(
                  '  const linkedFocus = useImpactInteractionStore((s) => s.linkedFocus);\n',
                  '  const linkedFocus = useImpactInteractionStore((s) => s.linkedFocus);\n  const tailSelection = useImpactInteractionStore((s) => s.tailSelection);\n',
                  1,
              )
          focus = '''        {linkedFocus && (\n          <div className="rounded-lg border border-red-400/40 bg-red-950/15 px-4 py-3">\n            <div className="text-[9px] uppercase tracking-[0.2em] text-red-300/80">Linked model focus</div>\n            <div className="mt-1 text-xs font-semibold text-war-white">{LINKED_FOCUS_COPY[linkedFocus].label}</div>\n            <p className="mt-1 text-[11px] leading-relaxed text-war-muted">{LINKED_FOCUS_COPY[linkedFocus].body}</p>\n          </div>\n        )}\n'''
          if 'Tail lens</div>' not in text:
              if focus not in text:
                  raise SystemExit('chat focus anchor not found')
              panel = '''\n        {tailSelection?.scenarioId === scenario.id && (\n          <div className="border border-red-400/35 bg-red-950/10 px-4 py-3">\n            <div className="text-[9px] uppercase tracking-[0.2em] text-red-300/80">Tail lens</div>\n            <div className="mt-1 flex items-baseline justify-between gap-3">\n              <div className="text-xs font-semibold text-war-white">{tailSelection.label}</div>\n              <div className="font-mono text-[10px] text-red-200">{(tailSelection.probabilityMass * 100).toFixed(1)}% mass</div>\n            </div>\n            <p className="mt-1 text-[11px] leading-relaxed text-war-muted">\n              Selected losses span ${tailSelection.lowMillions.toFixed(0)}M–${tailSelection.highMillions.toFixed(0)}M with a conditional mean of ${tailSelection.conditionalMeanMillions.toFixed(1)}M. That is about {tailSelection.ebitdaSharePercent.toFixed(0)}% of annual EBITDA.\n            </p>\n          </div>\n        )}\n'''
              text = text.replace(focus, focus + panel, 1)
          chat.write_text(text)

          globe = Path('src/app/ScenarioGlobe.tsx')
          text = globe.read_text()
          if not text.startswith('/* eslint-disable @typescript-eslint/no-explicit-any */'):
              text = '/* eslint-disable @typescript-eslint/no-explicit-any */\n' + text
          if 'const tailSelection = useImpactInteractionStore' not in text:
              text = text.replace(
                  '  const linkedFocus = useImpactInteractionStore((s) => s.linkedFocus);\n',
                  '  const linkedFocus = useImpactInteractionStore((s) => s.linkedFocus);\n  const tailSelection = useImpactInteractionStore((s) => s.tailSelection);\n',
                  1,
              )
          terrain = '''  const [terrainState, setTerrainState] = useState<\n    "loading" | "streaming" | "fallback" | "error"\n  >("loading");\n'''
          if 'const activeTailSelection' not in text:
              text = text.replace(
                  terrain,
                  terrain + '\n  const activeTailSelection =\n    tailSelection?.scenarioId === scenario.id ? tailSelection : null;\n',
                  1,
              )
          focus_line = '    const focusScale = linkedFocus === "grossP90" ? 1.45 : linkedFocus === "netP90" ? 1.28 : linkedFocus === "frequency" ? 1.18 : 1;\n'
          if 'const tailScale = activeTailSelection' not in text:
              text = text.replace(
                  focus_line,
                  focus_line + '''    const tailScale = activeTailSelection\n      ? 1 + Math.min(0.75, activeTailSelection.percentileLow * 0.45 + Math.min(0.3, activeTailSelection.ebitdaSharePercent / 100))\n      : 1;\n''',
                  1,
              )
          text = text.replace(
              '    const beaconScale = magnitudeScale * focusScale * choiceScale;\n',
              '    const beaconScale = magnitudeScale * focusScale * choiceScale * tailScale;\n',
              1,
          )
          text = text.replace(
              '    ready,\n    linkedFocus,\n    lastChoiceImpact,',
              '    ready,\n    activeTailSelection,\n    linkedFocus,\n    lastChoiceImpact,',
              1,
          )
          badge = '''      <div className="absolute right-3 top-3 z-10 rounded border border-white/15 bg-black/65 px-2 py-1 text-[9px] uppercase tracking-[0.16em] text-slate-300 backdrop-blur">\n        {terrainState === "streaming" && "Cesium terrain · streamed"}\n        {terrainState === "loading" && "Cesium terrain · loading"}\n        {terrainState === "fallback" && "Cesium terrain · fallback"}\n        {terrainState === "error" && "Cesium · unavailable"}\n      </div>\n'''
          if 'Conditional mean ${activeTailSelection.conditionalMeanMillions' not in text:
              if badge not in text:
                  raise SystemExit('globe badge anchor not found')
              text = text.replace(
                  badge,
                  badge + '''\n      {activeTailSelection && (\n        <div className="absolute right-3 top-10 z-10 border border-red-400/35 bg-black/75 px-2 py-1.5 font-mono text-[9px] text-red-200">\n          <div className="uppercase tracking-[0.14em]">{activeTailSelection.label}</div>\n          <div className="mt-0.5 text-slate-300">Conditional mean ${activeTailSelection.conditionalMeanMillions.toFixed(1)}M</div>\n        </div>\n      )}\n''',
                  1,
              )
          globe.write_text(text)
          PY
      - run: npm ci
      - name: Lint touched files
        run: npx eslint src/app/LossTailExplorer.tsx src/app/MetricsDashboard.tsx src/app/ChatPanel.tsx src/app/ScenarioGlobe.tsx src/model/scenarioLossDistribution.ts src/model/scenarioLossDistribution.test.ts src/store/interactionStore.ts --ext ts,tsx --report-unused-disable-directives --max-warnings 0
      - run: npm test -- --run
      - run: npm run build
      - name: Commit linked tail lens
        run: |
          git config user.name "jtflack-grc"
          git config user.email "202126308+jtflack-grc@users.noreply.github.com"
          git add src/app/MetricsDashboard.tsx src/app/ChatPanel.tsx src/app/ScenarioGlobe.tsx
          git commit -m "Link Monte Carlo tail lens across rails [tail-linked]"
          git push origin feat/tail-interrogation
