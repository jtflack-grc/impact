name: Verify tail scrubber

on:
  push:
    branches:
      - fix/tail-scrubber

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint src/app/LossTailExplorer.tsx --ext ts,tsx --report-unused-disable-directives --max-warnings 0
      - run: npm test -- --run
      - run: npm run build
