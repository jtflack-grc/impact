name: Patch and verify Cesium terrain underlay

on:
  push:
    branches:
      - fix/cesium-terrain-underlay

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[terrain-underlay]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cesium-terrain-underlay
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python tools/add_terrain_underlay.py
      - run: npm ci
      - run: npx eslint src/app/ScenarioGlobe.tsx --ext ts,tsx --report-unused-disable-directives --max-warnings 0
      - run: npm test -- --run
      - run: npm run build
      - name: Commit terrain underlay fix
        run: |
          git config user.name "jtflack-grc"
          git config user.email "202126308+jtflack-grc@users.noreply.github.com"
          git add src/app/ScenarioGlobe.tsx
          git commit -m "Backfill missing Cesium terrain geometry [terrain-underlay]"
          git push origin fix/cesium-terrain-underlay
