name: Verify CBG final

on:
  push:
    branches:
      - feat/causal-board-guided-clean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prettier --check src/app/BoardMode.tsx src/app/GuidedScenarioMode.tsx src/app/WhyDidThisChange.tsx src/app/Layout.tsx src/model/impactAnalysis.ts src/model/impactAnalysis.test.ts src/store/interactionStore.ts
      - run: npx eslint src/app/BoardMode.tsx src/app/GuidedScenarioMode.tsx src/app/WhyDidThisChange.tsx src/app/Layout.tsx src/app/ChatPanel.tsx src/app/MetricsDashboard.tsx src/app/ScenarioGlobe.tsx src/model/impactAnalysis.ts src/model/impactAnalysis.test.ts src/store/interactionStore.ts --ext ts,tsx --report-unused-disable-directives --max-warnings 0
      - run: npm test -- --run
      - run: npm run build
